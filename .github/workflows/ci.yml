name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: macOS / Node ${{ matrix.node }}
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run security:check

  package:
    name: Packed release-candidate baseline
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run pack:inspect
      - run: npm run test:packed
        env:
          PI_LOOPS_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
      - run: npm run test:packed:state
      - run: npm run test:e2e:scheduled:packed
      - run: mkdir -p artifacts && node scripts/security-check.mjs --sbom artifacts/pi-loops.cdx.json
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-loops-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
