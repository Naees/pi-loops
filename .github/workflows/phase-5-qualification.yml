name: Phase 5 qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == '22.19.0'
        run: npm run security:check
      - if: matrix.node == '22.19.0'
        run: npm run pack:inspect
      - if: matrix.node == '22.19.0'
        run: npm run test:packed
        env:
          PI_LOOPS_TEST_PI_CLI: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent/dist/cli.js
      - if: matrix.node == '22.19.0'
        run: npm run test:packed:state
      - if: matrix.node == '22.19.0'
        run: npm run test:e2e:scheduled:packed

  native-runtime:
    name: ${{ matrix.os }} / native Pi lifecycle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Start-Process "$env:SystemRoot\System32\ping.exe" -ArgumentList '-t','127.0.0.1' -PassThru
          $deadline = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() + 3000
          & "$env:ProgramFiles\PowerShell\7\pwsh.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./src/worker/windows-job-sentinel.ps1 -TargetProcessId $target.Id -AbsoluteDeadlineMs $deadline -StatusPath "$env:RUNNER_TEMP\pi-loops-sentinel-smoke.json"
          if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force; throw 'Job sentinel did not terminate its target' }
          Get-Content "$env:RUNNER_TEMP\pi-loops-sentinel-smoke.json"
      - run: git --version
      - run: node --version
      - run: node node_modules/@earendil-works/pi-coding-agent/dist/cli.js --version
      - run: npm run test:rpc:lifecycle:qualification
      - run: npm run test:e2e:proactive:qualification
