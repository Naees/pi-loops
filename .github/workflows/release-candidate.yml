name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build non-publishing release candidate
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PI_LOOPS_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run release:candidate
      - run: mkdir -p artifacts
      - run: node scripts/security-check.mjs --sbom artifacts/pi-loops.cdx.json
      - run: npm pack --pack-destination artifacts
      - run: shasum -a 256 artifacts/*.tgz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-loops-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
