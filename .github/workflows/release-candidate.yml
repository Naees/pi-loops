name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build non-publishing release candidate
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PI_LOOPS_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run release:candidate
      - run: mkdir -p artifacts
      - run: node scripts/security-check.mjs --sbom artifacts/pi-loops.cdx.json
      - run: npm pack --pack-destination artifacts
      - run: shasum -a 256 artifacts/*.tgz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-loops-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
