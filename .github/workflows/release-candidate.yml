name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build non-publishing release candidate
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PI_LOOPS_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run release:candidate
      - run: mkdir -p artifacts
      - run: node scripts/security-check.mjs --sbom artifacts/pi-loops.cdx.json
      - run: npm pack --pack-destination artifacts
      - run: shasum -a 256 artifacts/*.tgz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-loops-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
