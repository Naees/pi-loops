name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build non-publishing release candidate
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PI_LOOPS_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run release:candidate
      - run: mkdir -p artifacts
      - run: node scripts/security-check.mjs --sbom artifacts/pi-loops.cdx.json
      - run: npm pack --json --pack-destination artifacts > artifacts/npm-pack.json
      - run: cd artifacts && shasum -a 256 *.tgz > SHA256SUMS && shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pi-loops-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
