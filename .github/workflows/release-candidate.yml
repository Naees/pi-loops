name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build non-publishing release candidate
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PI_LOOPS_TEST_PI: ${{ github.workspace }}/node_modules/.bin/pi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run release:candidate
      - run: mkdir -p artifacts
      - run: node scripts/security-check.mjs --sbom artifacts/pi-loops.cdx.json
      - run: npm pack --json --pack-destination artifacts > artifacts/npm-pack.json
      - run: cd artifacts && shasum -a 256 *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pi-loops-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
